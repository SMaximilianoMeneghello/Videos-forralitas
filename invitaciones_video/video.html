<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:GV;src:url(fonts/GreatVibes-Regular.ttf)}
@font-face{font-family:PF;src:url(fonts/PlayfairDisplay.ttf);font-weight:400 900}
@font-face{font-family:MS;src:url(fonts/Montserrat.ttf);font-weight:100 900}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0d0517;font-family:MS}
canvas{position:absolute;left:0;top:0}
#stage{position:absolute;inset:0;perspective:2200px}
.scene{position:absolute;inset:0;display:none}
.abs{position:absolute}
.gold{background:linear-gradient(100deg,#9a6a1a 0%,#f7e08a 18%,#c8932f 38%,#fff3b0 50%,#c8932f 62%,#f7e08a 82%,#9a6a1a 100%);background-size:250% 100%;background-position:var(--p,0%) 0;-webkit-background-clip:text;background-clip:text;color:transparent}
.ctr{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap}
/* ---------- phone ---------- */
.pw{position:absolute;left:0;top:0;width:420px;height:860px;will-change:transform}
.phone{position:absolute;inset:0;border-radius:68px;background:linear-gradient(145deg,#2b2b33,#0a0a0d 40%,#1c1c22);padding:14px;box-shadow:0 0 0 2px #55555f inset,0 0 0 5px #0a0a0d inset,0 50px 90px rgba(0,0,0,.65),0 0 70px rgba(255,200,120,.18)}
.screen{position:relative;width:392px;height:832px;border-radius:54px;overflow:hidden;background:#000}
.island{position:absolute;left:50%;top:12px;width:112px;height:32px;margin-left:-56px;border-radius:20px;background:#000;z-index:5}
.glare{position:absolute;inset:0;z-index:6;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 48%,rgba(255,255,255,.05) 55%,transparent 62%);background-size:300% 100%;background-position:var(--g,100%) 0}
/* ---------- invitation ---------- */
.inv{position:absolute;inset:0;overflow:hidden;text-align:center;color:var(--ink);background:var(--bg)}
.inv .deco{position:absolute;inset:0}
.inv .c{position:absolute;left:0;right:0;top:56px;bottom:112px;display:flex;flex-direction:column;align-items:center;justify-content:space-around}
.inv .head{display:flex;flex-direction:column;align-items:center;gap:2px}
.inv .mis{font:600 24px PF;letter-spacing:5px}
.inv .num{font:700 126px/1 PF;color:var(--num)}
.inv .name{font:400 86px/1 GV;color:var(--name);padding:0 10px}
.inv .te{font-size:14.5px;font-weight:600;letter-spacing:2.5px;line-height:1.55}
.inv .date{line-height:1.2}
.inv .dia,.inv .mes,.inv .hs{font-size:15px;letter-spacing:3px;font-weight:500}
.inv .dnum{font:600 58px/1.05 PF}
.inv .ven{display:flex;gap:10px;align-items:center;text-align:left}
.inv .ven b{display:block;font:600 17px MS}
.inv .ven span{display:block;font-size:12px;line-height:1.3;opacity:.8}
.inv .btn{position:absolute;left:38px;right:38px;bottom:40px;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;letter-spacing:1.5px;background:var(--btnbg);color:var(--btnc);border:var(--btnb,0)}
.gt{background:linear-gradient(180deg,#fff0a8,#e2b04a 50%,#a8741c);-webkit-background-clip:text;background-clip:text;color:transparent!important}
.floral{--bg:linear-gradient(#fff3f6,#fcd7e3);--ink:#b0194f;--num:#b0194f;--name:#b0194f;--btnbg:#c2185b;--btnc:#fff}
.blk{--bg:#050505;--ink:#f1d68a;--btnbg:transparent;--btnc:#f1d68a;--btnb:2px solid #e9c86b}
.blk.inv .num,.blk.inv .name{background:linear-gradient(180deg,#fff0a8,#e2b04a 55%,#a8741c);-webkit-background-clip:text;background-clip:text;color:transparent}
.blue{--bg:radial-gradient(ellipse at 50% 28%,#0d46b8,#03123f 62%,#000);--ink:#dbe8ff;--num:#fff;--name:#fff;--btnbg:rgba(10,40,110,.4);--btnc:#cfe4ff;--btnb:2px solid #4aa3ff}
.pastel{--bg:linear-gradient(#fff1f4,#f9cfdd);--ink:#c0305f;--num:#c0305f;--name:#c0305f;--btnbg:#d63b6b;--btnc:#fff}
.neon{--bg:radial-gradient(ellipse at 50% 40%,#220a52,#07021a 70%);--ink:#fff;--num:#fff;--name:#38b8ff;--btnbg:#e0159a;--btnc:#fff}
.neon .num{text-shadow:0 0 14px #fff,0 0 30px #b05cff}.neon .name{text-shadow:0 0 10px #38b8ff,0 0 26px #1c7bff}.neon .btn{box-shadow:0 0 18px #ff3cc2}
.minimal{--bg:linear-gradient(#faf6ea,#f1ecd9);--ink:#3b4a3a;--num:#3b4a3a;--name:#2f3b2f;--btnbg:#3b5a3b;--btnc:#fff}
.glitter{--bg:linear-gradient(165deg,#ffd9d2,#f3aaa2 50%,#d97782);--ink:#9b1239;--num:#9b1239;--name:#9b1239;--btnbg:#d6455f;--btnc:#fff}
.trendy{--bg:#fff;--ink:#111;--num:#111;--name:#111;--btnbg:#000;--btnc:#fff}
.blue .num{font-size:110px}.blue .c{justify-content:space-between}
.tw{position:absolute}
.chip{position:absolute;width:305px;height:104px;border-radius:52px;display:flex;align-items:center;gap:12px;padding:0 14px 0 14px;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.07));border:2px solid rgba(240,200,110,.7);backdrop-filter:blur(6px);color:#fff;font:600 23px/1.2 MS;box-shadow:0 10px 40px rgba(0,0,0,.4),0 0 30px rgba(240,190,90,.25);will-change:transform}
.chip .ic{flex:none;width:70px;height:70px;border-radius:50%;background:linear-gradient(145deg,#f7e08a,#b9822a);display:flex;align-items:center;justify-content:center}
.chip svg{width:40px;height:40px;stroke:#3a2208;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.lbl{position:absolute;width:250px;height:46px;border-radius:23px;white-space:nowrap;background:linear-gradient(#f4dfa3,#c99a45);color:#3a2208;font:700 17px/46px MS;letter-spacing:1px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.pill{display:inline-block;padding:14px 46px;border-radius:50px;background:linear-gradient(90deg,#c99a45,#f6e3a1 50%,#c99a45);color:#2a1604;font:700 30px MS;letter-spacing:3px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.band{position:absolute;top:0;left:0;width:340px;height:2100px;margin-top:-90px;background:linear-gradient(90deg,transparent,rgba(255,230,160,.0) 10%,rgba(255,240,190,.75) 50%,rgba(255,230,160,0) 90%,transparent);transform:skewX(-18deg);mix-blend-mode:screen;display:none;pointer-events:none;z-index:50}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset=".5" stop-color="#e2b04a"/><stop offset="1" stop-color="#a8741c"/></linearGradient>
<radialGradient id="bal" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff3b0"/><stop offset=".4" stop-color="#d9a73b"/><stop offset="1" stop-color="#6e4710"/></radialGradient>
<radialGradient id="ball" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#c8932f"/><stop offset="1" stop-color="#4a2f08"/></radialGradient>
<radialGradient id="pball" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffd0ec"/><stop offset=".5" stop-color="#e0509e"/><stop offset="1" stop-color="#5a1038"/></radialGradient>
<linearGradient id="bow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc2d8"/><stop offset="1" stop-color="#e5739f"/></linearGradient>
<linearGradient id="car" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a6be0"/><stop offset=".6" stop-color="#0a2a78"/><stop offset="1" stop-color="#030a26"/></linearGradient>
</defs></svg>
<canvas id="bg" width="1080" height="1920"></canvas>
<div id="stage"></div>
<div class="band" id="band"></div>
<canvas id="fx" width="1080" height="1920" style="z-index:60;pointer-events:none"></canvas>

<script>
/* ===================== utilidades ===================== */
const W=1080,H=1920,TOTAL=24;
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const pr=(t,a,b)=>cl((t-a)/(b-a));
const eo3=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eob=x=>{const c1=1.45,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const stage=document.getElementById('stage');

/* ===================== invitaciones ===================== */
const CROWN=`<svg width="54" height="34" viewBox="0 0 60 36"><path d="M4 30 L8 8 L20 20 L30 3 L40 20 L52 8 L56 30 Z" fill="url(#g1)"/><rect x="4" y="30" width="52" height="5" rx="2" fill="url(#g1)"/></svg>`;
const PIN=c=>`<svg width="24" height="30" viewBox="0 0 24 30"><path d="M12 1C6 1 2 5.500 2 11c0 7 10 18 10 18s10-11 10-18C22 5.500 18 1 12 1z" fill="${c}"/><circle cx="12" cy="11" r="4" fill="#fff"/></svg>`;
function flower(cx,cy,r,c1,c2,rot){let p='';for(let i=0;i<5;i++)p+=`<ellipse cx="0" cy="${-r*.58}" rx="${r*.4}" ry="${r*.62}" fill="${c1}" transform="rotate(${i*72})"/>`;return`<g transform="translate(${cx},${cy}) rotate(${rot})">${p}<circle r="${r*.2}" fill="${c2}"/></g>`}
function leaf(cx,cy,len,rot,col){return`<path d="M0 0 Q${len*.35} ${-len*.3} ${len} 0 Q${len*.35} ${len*.3} 0 0Z" fill="${col}" transform="translate(${cx},${cy}) rotate(${rot})"/>`}
function flowersDeco(seed,c1,c2,c3,leafc){const r=rng(seed);let s='';
 const pts=[[20,60,44],[58,150,26],[12,300,36],[44,430,28],[18,560,38],[52,690,26],[372,36,38],[338,126,28],[382,260,34],[350,380,26],[376,520,40],[344,650,30],[372,770,34],[30,790,36]];
 pts.forEach(p=>{s+=leaf(p[0],p[1],p[2]*1.6,r()*360,leafc)});
 pts.forEach(p=>{s+=flower(p[0],p[1],p[2],r()>.5?c1:c2,c3,r()*72)});
 for(let i=0;i<14;i++){const left=i%2,x=left?r()*60:332+r()*60,y=r()*832;s+=`<circle cx="${x}" cy="${y}" r="${3+r()*4}" fill="${c1}" opacity=".7"/>`}
 return`<svg width="392" height="832" viewBox="0 0 392 832">${s}</svg>`}
function branch(x,y,ang,len,col,n){let s=`<g transform="translate(${x},${y}) rotate(${ang})"><path d="M0 0 Q${len/2} -10 ${len} 0" stroke="${col}" stroke-width="2.5" fill="none"/>`;for(let i=1;i<=n;i++){const px=len*i/(n+1);const py=-8*Math.sin(Math.PI*i/(n+1));s+=leaf(px,py,40,-50,col)+leaf(px,py,40,50,col)}return s+leaf(len,0,44,0,col)+'</g>'}
function minimalDeco(){let s='';[[0,40,35,200,6],[392,70,145,210,6],[0,760,-35,210,6],[392,780,215,210,6],[0,420,10,120,4],[392,440,170,120,4]].forEach((b,i)=>{s+=branch(b[0],b[1],b[2],b[3],i%2?'#8fa87f':'#a9bf98',b[4])});return`<svg width="392" height="832">${s}</svg>`}
function balloon(x,y,rx,ry,rot){return`<g transform="translate(${x},${y}) rotate(${rot})"><path d="M0 ${ry} Q8 ${ry+50} -4 ${ry+110}" stroke="#c8932f" fill="none" stroke-width="1.5"/><ellipse rx="${rx}" ry="${ry}" fill="url(#bal)"/><ellipse cx="${-rx*.3}" cy="${-ry*.4}" rx="${rx*.18}" ry="${ry*.3}" fill="#fff" opacity=".45"/><path d="M-5 ${ry} L5 ${ry} L0 ${ry+8}Z" fill="#9a6a1a"/></g>`}
function discoBall(x,y,r,id){let g='';for(let i=-3;i<=3;i++){g+=`<ellipse cx="${x}" cy="${y}" rx="${Math.abs(i)/3*r}" ry="${r}" fill="none" stroke="#2a1a05" stroke-width="1.2" opacity=".55"/>`;g+=`<line x1="${x-r}" x2="${x+r}" y1="${y+i*r/3.6}" y2="${y+i*r/3.6}" stroke="#2a1a05" stroke-width="1.2" opacity=".55"/>`}return`<circle cx="${x}" cy="${y}" r="${r}" fill="url(#${id||'ball'})"/>${g}<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#f3d37a" stroke-width="1.5" opacity=".6"/><line x1="${x}" y1="${y-r}" x2="${x}" y2="${y-r-40}" stroke="#aaa" stroke-width="1.5"/>`}
function star4(x,y,s,col){return`<path d="M${x} ${y-s}Q${x} ${y} ${x+s} ${y}Q${x} ${y} ${x} ${y+s}Q${x} ${y} ${x-s} ${y}Q${x} ${y} ${x} ${y-s}Z" fill="${col}"/>`}
function sparkles(seed,n,col,svgmode){const r=rng(seed);let s='';for(let i=0;i<n;i++){const x=r()*392,y=r()*832,z=3+r()*7;s+=`<g class="tw" data-ph="${(r()*6.28).toFixed(2)}" style="position:static">${star4(x,y,z,col)}</g>`}return s}
const neonSt=(c,w=3)=>`fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"`;
function neonDeco(){return`<svg width="392" height="832" style="filter:drop-shadow(0 0 5px currentColor)">
<g color="#ff3cc2"><path d="M20 60 L60 40 L50 92 L100 70" ${neonSt('#ff3cc2')}/><path d="M330 40 L372 70 L338 110" ${neonSt('#ff3cc2')}/><path d="M18 330 L50 300 L70 340" ${neonSt('#ff3cc2')}/></g>
<g color="#38b8ff"><path d="M300 90 L340 60 M312 130 L352 100" ${neonSt('#38b8ff')}/><path d="M20 140 L26 190 L70 160Z" ${neonSt('#38b8ff')}/><path d="M340 560 l30 -20 l10 40 l-40 0z" ${neonSt('#38b8ff')}/></g>
<g color="#b05cff"><path d="M26 430 l20 -22 l12 28" ${neonSt('#b05cff')}/><path d="M350 330 l24 -20 l-6 38" ${neonSt('#b05cff')}/><path d="M340 700 Q360 660 375 700" ${neonSt('#b05cff')}/></g>
<g color="#ff3cc2"><rect x="24" y="560" width="82" height="50" rx="22" ${neonSt('#ff3cc2')}/><path d="M44 576 v16 M36 584 h16" ${neonSt('#ff3cc2')}/><circle cx="84" cy="578" r="4" ${neonSt('#ff3cc2',2)}/><circle cx="94" cy="590" r="4" ${neonSt('#ff3cc2',2)}/></g>
<g color="#38b8ff">${star4(60,760,16,'#38b8ff')}${star4(330,420,12,'#38b8ff')}${star4(360,170,10,'#ff3cc2')}</g></svg>`}
function blueDeco(){return`<svg width="392" height="832" style="filter:drop-shadow(0 0 6px #2f9bff)"><g ${neonSt('#58b2ff',3)}><path d="M0 120 L60 60 L60 0"/><path d="M392 100 L330 160 L330 230 L392 280"/><path d="M0 460 L40 420 L40 330"/><path d="M392 560 L350 600 L350 700"/><path d="M0 760 L50 710 L120 710"/><path d="M392 40 L350 80 L300 80" stroke="#9dd2ff"/><path d="M20 250 L70 250 L100 280" stroke="#9dd2ff"/></g></svg>`}
const CARSVG=`<svg width="290" height="96" viewBox="0 0 290 96"><ellipse cx="145" cy="86" rx="130" ry="9" fill="#2f9bff" opacity=".45"/><path d="M8 68 Q22 52 62 48 L108 22 Q150 10 190 24 L222 46 Q268 52 282 68 L282 78 L8 78Z" fill="url(#car)" stroke="#6db8ff" stroke-width="1.5"/><path d="M112 26 Q150 16 186 28 L208 46 L96 46Z" fill="#081a52" stroke="#4aa3ff" stroke-width="1"/><circle cx="76" cy="78" r="17" fill="#05091c" stroke="#6db8ff" stroke-width="2"/><circle cx="224" cy="78" r="17" fill="#05091c" stroke="#6db8ff" stroke-width="2"/><circle cx="76" cy="78" r="7" fill="#9dd2ff"/><circle cx="224" cy="78" r="7" fill="#9dd2ff"/><rect x="262" y="58" width="16" height="5" rx="2" fill="#bfeaff"/><rect x="10" y="58" width="12" height="5" rx="2" fill="#ff5a5a"/></svg>`;
const BOWSVG=`<svg width="230" height="130" viewBox="0 0 230 130"><path d="M115 62 C70 0 8 14 14 60 C20 108 80 96 115 66Z" fill="url(#bow)" stroke="#d8658f" stroke-width="1.5"/><path d="M115 62 C160 0 222 14 216 60 C210 108 150 96 115 66Z" fill="url(#bow)" stroke="#d8658f" stroke-width="1.5"/><path d="M110 70 L78 126 L104 116 L112 128Z" fill="#f08fb0"/><path d="M120 70 L152 126 L126 116 L118 128Z" fill="#f08fb0"/><rect x="100" y="46" width="30" height="34" rx="12" fill="#f58aae" stroke="#d8658f" stroke-width="1.5"/></svg>`;
function glitterDeco(){const r=rng(77);let s='';for(let i=0;i<110;i++){const y=Math.pow(r(),1.6)*832,x=r()*392,z=1.5+r()*5;const c=['#fff','#ffe7a8','#ffc2b8','#ffb3c0'][i%4];s+=`<span class="tw" data-ph="${(r()*6.28).toFixed(2)}" style="left:${x}px;top:${y}px;width:${z}px;height:${z}px;border-radius:50%;background:${c};box-shadow:0 0 ${z*2}px ${c}"></span>`}return s}
function trendyDeco(){const ph=(x,y,w,h,rot,c)=>`<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${rot}deg);background:#fff;padding:6px 6px 16px;box-shadow:0 4px 14px rgba(0,0,0,.3)"><div style="width:100%;height:100%;background:${c}"></div></div>`;
 return`${ph(8,150,76,92,-8,'linear-gradient(160deg,#444,#111)')}${ph(318,130,70,88,9,'linear-gradient(160deg,#6a5a52,#1b1410)')}${ph(6,380,70,86,6,'linear-gradient(160deg,#58616d,#15191f)')}${ph(322,360,72,90,-7,'linear-gradient(160deg,#775,#221)')}${ph(10,600,74,90,-6,'linear-gradient(160deg,#5a4a4a,#1a1010)')}${ph(318,610,74,90,8,'linear-gradient(160deg,#4a5560,#10151c)')}
 <svg style="position:absolute;left:0;top:0" width="392" height="200">${discoBall(70,62,40,'pball').replace(/<line[^>]*stroke="#aaa"[^>]*\/>/,'')}${star4(330,40,14,'#111')}${star4(300,220,9,'#111')}</svg>`}
function floralDeco(){return flowersDeco(11,'#f7b4c9','#fbd0dd','#ffe9a0','#9fc89a')}
function pastelDeco(){return flowersDeco(23,'#f9c2d2','#fdd9e3','#fff0b0','#b6d9b0')}
function goldDeco(){return`<svg width="392" height="832">${balloon(36,110,34,46,-8)}${balloon(14,250,30,40,6)}${balloon(78,190,28,38,-4)}${balloon(352,120,34,46,8)}${balloon(376,270,30,40,-6)}${balloon(326,210,28,38,4)}${discoBall(46,590,44)}${discoBall(350,650,44)}${sparkles(5,34,'#ffe9a0')}</svg>`}
const THEMES={
 floral:{cls:'floral',crown:1,num:15,name:'Sofía',te:'TE INVITO A CELEBRAR<br>MIS 15 AÑOS',d:20,m:'ABRIL',h:'20:00 HS.',v:'Salón La Estancia',a:'Av. Siempre Viva 125<br>Tucumán',deco:floralDeco(),pin:'#c2185b',lbl:'ELEGANTE FLORAL'},
 gold:{cls:'blk',crown:1,num:18,name:'Thiago',te:'TE INVITO A MI FIESTA<br>MIS 18 AÑOS',d:15,m:'JUNIO',h:'22:00 HS.',v:'Salón Sunset',a:'Av. del Sol 456<br>Tucumán',deco:goldDeco(),pin:'#e9c86b',lbl:'BLACK & GOLD'},
 blue:{cls:'blue',crown:1,num:18,name:'Mateo',te:'TE INVITO A MI CUMPLE',d:10,m:'MAYO',h:'22:00 HS.',v:'Quinta Los Robles',a:'Ruta 9 km. 128<br>Tucumán',deco:blueDeco(),mid:CARSVG,pin:'#4aa3ff',lbl:'MODERNO MASCULINO'},
 pastel:{cls:'pastel',crown:1,num:15,name:'Emma',te:'TE INVITO A CELEBRAR<br>MIS 15 AÑOS',d:12,m:'ABRIL',h:'20:30 HS.',v:'Salón Bella Vista',a:'Av. San Martín 755<br>Tucumán',deco:pastelDeco(),mid:BOWSVG,pin:'#d63b6b',lbl:'PASTEL'},
 neon:{cls:'neon',crown:1,num:18,name:'Bautista',te:'TE INVITO A MI FIESTA',d:26,m:'ABRIL',h:'22:00 HS.',v:'Club Life',a:'Av. Roca 221<br>Tucumán',deco:neonDeco(),pin:'#ff3cc2',lbl:'NEÓN'},
 minimal:{cls:'minimal',crown:1,num:15,name:'Luciana',te:'TE INVITO A CELEBRAR<br>MIS 15 AÑOS',d:17,m:'MAYO',h:'20:00 HS.',v:'Salón del Jardín',a:'Av. Perón 1000<br>Tucumán',deco:minimalDeco(),pin:'#3b5a3b',lbl:'MINIMALISTA'},
 glitter:{cls:'glitter',crown:1,num:15,name:'Valentina',te:'TE INVITO A CELEBRAR<br>MIS 15 AÑOS',d:24,m:'MAYO',h:'21:00 HS.',v:'Quinta El Paraíso',a:'Av. Aconquija 875<br>Tucumán',deco:glitterDeco(),pin:'#c2185b',lbl:'GLITTER'},
 trendy:{cls:'trendy',crown:1,num:18,name:'Benjamín',te:'TE INVITO A FESTEJAR<br>MIS 18 AÑOS',d:'09',m:'AGOSTO',h:'22:00 HS.',v:'Salón Downtown',a:'San Martín 742<br>Tucumán',deco:trendyDeco(),pin:'#111',lbl:'TRENDY'}
