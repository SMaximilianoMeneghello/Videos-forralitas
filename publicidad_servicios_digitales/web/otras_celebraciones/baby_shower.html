<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baby shower · Benja (demo)</title>
<link rel="stylesheet" href="base.css">
<style>
.card{background:linear-gradient(180deg,#dfeee4 0%,#f6efe4 55%,#fbd9c9 100%);color:#4f6b5c;font-family:Fredoka}
.nube{position:absolute;background:#fff;border-radius:60px;opacity:.95;filter:drop-shadow(0 8px 12px rgba(79,107,92,.12))}
.nube::before,.nube::after{content:"";position:absolute;background:#fff;border-radius:50%}
.n1{left:-40px;top:140px;width:200px;height:60px;animation:deriva 9s linear infinite}.n1::before{left:40px;top:-40px;width:90px;height:90px}.n1::after{left:100px;top:-24px;width:70px;height:70px}
.n2{right:-30px;top:330px;width:170px;height:50px;animation:deriva 11s linear infinite reverse}.n2::before{left:30px;top:-34px;width:76px;height:76px}.n2::after{left:84px;top:-20px;width:60px;height:60px}
@keyframes deriva{0%,100%{transform:translateX(0)}50%{transform:translateX(30px)}}
.luna{position:absolute;left:50%;top:150px;width:150px;height:150px;margin-left:-75px;border-radius:50%;box-shadow:-26px 12px 0 0 #f2c38f;transform:rotate(-20deg);animation:pop 1.2s .3s both}
.globo{position:absolute;width:70px;height:86px;border-radius:50% 50% 48% 48%;animation:subeg 2.2s cubic-bezier(.2,.8,.2,1) both,flotar 3s ease-in-out infinite}
.globo::after{content:"";position:absolute;left:34px;top:86px;width:1.5px;height:90px;background:#9fb3a6}
@keyframes subeg{from{transform:translateY(500px)}to{transform:none}}
.t1{top:360px;font:500 20px Montserrat;letter-spacing:.45em;padding-left:.45em;animation-delay:1.1s}
.nom{top:395px;font:400 130px/1.1 Allura;color:#c27a5a;animation-delay:1.4s}
.t2{top:545px;font:500 30px Fredoka;color:#4f6b5c;animation-delay:1.8s}
.datos{top:700px;font:500 24px/1.5 Fredoka;animation-delay:2.2s}
.datos b{display:block;font-size:32px;color:#c27a5a}
</style></head><body>
<div class="card">
 <div class="nube n1"></div><div class="nube n2"></div>
 <div class="luna"></div>
 <div class="globo" style="left:40px;top:470px;background:#f6b9a0;animation-delay:.4s,2.6s"></div>
 <div class="globo" style="left:420px;top:520px;background:#a9cdb5;animation-delay:.7s,2.9s"></div>
 <div class="globo" style="left:450px;top:430px;width:56px;height:70px;background:#f3d9a4;animation-delay:.9s,3.1s"></div>
 <p class="ctr in t1">BABY SHOWER</p>
 <p class="ctr in nom">Benja</p>
 <p class="ctr in t2">¡ya casi llega!</p>
 <div class="ctr in datos"><b>Sábado 19 de junio · 17 h</b>Te esperamos para festejar juntos<br>Casa de la familia (ejemplo)</div>
 <p class="demo">DEMO · DATOS FICTICIOS</p>
</div>
<script src="escala.js"></script>
</body></html>
